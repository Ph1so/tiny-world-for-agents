# The example sweep from PLAN.md section 11. Model names must match configs/models.yaml.
#   uv run python -m tinyworld.runner.sweep configs/sweeps/memory_sweep.yaml
name: memory_sweep
controller: llm
seeds: [1, 2, 3]
max_steps: 1500
models: [model_a, model_b]
memory_chars: [0, 500, 2000, 8000, 32000]
history_window: [3]
names: familiar
shuffle_recipes: false
on_death: respawn_keep_memory
budget_usd: 25
parallel_runs: 4
