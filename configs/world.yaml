# World settings. Every balance number lives here. Tuned in milestone 2.
size: [64, 32, 64]          # x (east), y (up), z (south)
sea_level: 12
names: familiar             # familiar | alien
shuffle_recipes: false
on_death: respawn_keep_memory   # respawn_keep_memory | respawn_wipe_memory | end_run
on_stuck: end_run               # end_run | continue (continue only logs the stuck event)

vitals_lookback: 60         # observation shows health and food this many steps ago (0 = off)
rule_notes: true            # say why a craft failed or health is not rising, list what was made (see DECISIONS 109)
recipe_book: false         # list every craft in the system prompt (see DECISIONS 110)

day_length: 300
night_start: 200            # steps 0..199 are day, 200..299 are night
dim_steps: 20               # last steps of day and of night are "dim"
torch_light: 6              # a torch this close turns dark into dim

inventory_slots: 10         # a slot holds one tool or up to stack_size of an item; 0 = no limit
stack_size: 32
chest_slots: 20

reach: 3                    # mine and place distance
attack_reach: 2
station_reach: 2            # workbench or furnace "nearby"
close_radius: 3             # observation "close" list
view_radius: 12             # observation "in view" list

vitals:
  max_health: 20
  max_food: 20
  food_drain_every: 15
  starve_every: 5
  heal_food_min: 15
  heal_every: 10
  max_air: 10
  drown_damage: 2
  fall_safe: 3

food: {berries: 2, raw meat: 3, cooked meat: 8, bread: 6}
berries_per_bush: 2
bush_regrow: 150

# Steps to break a block = ceil(hardness / tool_speed[pickaxe tier]).
hardness:
  grass: 2
  dirt: 2
  sand: 2
  leaves: 1
  berry bush: 1
  torch: 1
  log: 4
  planks: 3
  workbench: 4
  door: 4
  chest: 4
  sprout: 1
  wheat: 1
  bed: 2
  furnace: 6
  stone: 8
  coal ore: 10
  iron ore: 12
tool_speed: [1, 2, 3, 4]    # hand, wood, stone, iron pickaxe

durability:                 # uses before the tool is gone
  wood pickaxe: 30
  stone pickaxe: 60
  iron pickaxe: 150
  wood sword: 20
  stone sword: 40
  iron sword: 100
  iron helmet: 30
  iron chestplate: 40
hand_damage: 2
sword_damage: {wood sword: 3, stone sword: 4, iron sword: 6}
armor: {iron helmet: 1, iron chestplate: 2}   # zombie damage taken off per piece held, at least 1 gets through

sleep_zombie_dist: 8        # no sleep with a zombie this close
sleep_heal_every: 5         # asleep with food above 0: 1 health every this many steps
hear_radius: 16             # multi-agent: "say" reaches agents this close
say_max_chars: 200          # longer speech is cut
pvp_loot: false             # multi-agent: a killer gets what fits of the victim's inventory

farming:
  seed_chance: 0.25         # chance that mining grass also gives 1 seeds
  water_dist: 4             # seeds need water within this many cells sideways, level with the soil or up to 2 below; 0 = no need
  grow_steps: 300           # steps for a sprout to turn into wheat; steps in rain count double
  wheat_per_crop: 2
  seeds_per_crop: 1         # plus 1 more with seed_bonus_chance
  seed_bonus_chance: 0.5

weather:
  enabled: true
  spell: 100                # a new weather every this many steps (the first spell is clear)
  rain_prob: 0.25
  storm_prob: 0.1           # a storm is dark: zombies spawn and stay out by day
  rain_food_mult: 2         # with no roof in rain or storm: food drains this many times as fast, no healing
  hail_every: 6             # with no roof in a storm: hail_damage every this many steps
  hail_damage: 1

terrain:
  base_height: 15.2
  noise_scales: [16, 8, 4]
  noise_amps: [5.0, 2.5, 1.2]
  edge_width: 9
  edge_depth: 7
  hill_height: 9.0
  hill_radius: 7.0
  stone_line: 19            # ground at or above this height is bare stone
  lake_radius: 4.5
  lake_depth: 3
  coal_rate: 0.05           # share of stone cells that are coal ore
  iron_rate: 0.035
  surface_coal: 14           # extra ore cells put on the bare stone surface
  surface_iron: 14
  forest_tree_rate: 0.10
  plain_tree_rate: 0.006
  min_trees: 10
  bush_rate: 0.012
  min_bushes: 12
  berry_density_mult: 1.0  # scales berry bush spawn rate and minimum count

creatures:
  sheep_start: 6
  chicken_start: 6
  passive_max: 8            # per kind
  passive_respawn: 2        # per kind, each morning
  passive_move_prob: 0.25
  animal_count_mult: 1.0    # scales sheep+chicken start, max, and respawn
  health: {sheep: 6, chicken: 4, zombie: 10}
  meat: {sheep: 2, chicken: 1, zombie: 0}
  wool: {sheep: 1}        # wool from a sheep kill
  zombie_max: 9
  zombie_spawn_prob: 0.12   # chance per night step while below zombie_max
  zombie_spawn_min_dist: 12
  zombie_spawn_max_dist: 24
  zombie_dark_spawn_prob: 0.015  # any hour: chance per step of a spawn in a covered cell with no torch near
  zombie_dark_min_dist: 5         # sideways distance from the agent for those spawns
  zombie_chase_dist: 15
  zombie_step_every: 1.5    # world steps per zombie move (1.5 = moves on 2 of every 3 steps)
  zombie_damage: 3
  zombie_cooldown: 2
  zombie_breaks: []         # block names a blocked zombie can break (empty = none)
  zombie_break_steps: 4     # steps adjacent to break one soft block
  torch_radius: 6           # a torch this close suppresses zombie spawns
