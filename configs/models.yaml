# Named model entries. A run picks one by name: --model haiku
#
# provider: anthropic | openai_compatible | mock
# model:    the provider's model id
# input_per_m / output_per_m: USD per million tokens
# cache_read_per_m / cache_write_per_m: optional, used when the provider reports cached tokens
# max_tokens: reply budget per call. A thinking budget must fit inside it.
# 2048, not 1024: with a 2000-char memory the agent rewrites the whole file each step, and at 1024
# about 4% of Haiku replies were cut off before the action (a wasted call). Truncated calls already
# spent the full budget, so the bigger cap costs little.
# thinking (anthropic) / reasoning (openai_compatible): optional, passed through as given
# sampling: temperature, top_p ... leave empty for provider defaults
# base_url, api_key_env: openai_compatible only
#
# Every entry has a note that says whether its id and price were checked against the
# provider's own pages, and when. Verified on 2026-10-07 (review) against
#   platform.claude.com/docs/en/models/overview, /docs/en/about-claude/pricing,
#   /docs/en/about-claude/model-deprecations (Anthropic) and
#   developers.openai.com/api/docs/models and /api/docs/pricing (OpenAI).
# Anthropic cache_write_per_m is the 5 minute cache write price. Prices change; recheck
# before a big sweep. The cheapest real models are `haiku` and `gpt6_luna`.

models:
  mock:
    provider: mock
    model: mock-sensible
    mock: {kind: sensible}            # the sensible bot in the reply format, with memory edits
    note: no network, zero cost, used by tests

  mock_wait:
    provider: mock
    model: mock-wait
    mock: {kind: scripted}            # always waits one step
    note: no network, zero cost

  # ---- Anthropic, current line-up -------------------------------------------------------

  haiku:
    provider: anthropic
    model: claude-haiku-5-5
    input_per_m: 0.10
    output_per_m: 0.50
    cache_read_per_m: 0.01
    cache_write_per_m: 0.125
    max_tokens: 2048
    note: verified 2026-10-07 (id on the models overview and deprecations pages, price on the pricing page, prompts up to 100k tokens). The cheap default.

  sonnet:
    provider: anthropic
    model: claude-sonnet-5-5
    input_per_m: 2.00
    output_per_m: 10.00
    cache_read_per_m: 0.10
    cache_write_per_m: 2.50
    max_tokens: 2048
    note: verified 2026-10-07 (models overview, pricing, deprecations pages).

  opus:
    provider: anthropic
    model: claude-opus-5-5
    input_per_m: 4.00
    output_per_m: 20.00
    cache_read_per_m: 0.20
    cache_write_per_m: 5.00
    max_tokens: 2048
    note: verified 2026-10-07 (models overview, pricing, deprecations pages).

  sonnet_thinking:
    provider: anthropic
    model: claude-sonnet-5-5
    input_per_m: 2.00
    output_per_m: 10.00
    cache_read_per_m: 0.10
    cache_write_per_m: 2.50
    max_tokens: 4096
    thinking: {type: enabled, budget_tokens: 2048}
    note: same id and price as sonnet (verified 2026-10-07), with extended thinking. Thinking tokens are billed as output.

  # ---- Anthropic, older models still active (useful for "only the model changes") --------

  haiku45:
    provider: anthropic
    model: claude-haiku-4-5-20251001
    input_per_m: 1.00
    output_per_m: 5.00
    cache_read_per_m: 0.10
    cache_write_per_m: 1.25
    max_tokens: 2048
    note: verified 2026-10-07 (deprecations page lists the id as active, pricing page has the price). Retires no sooner than 2026-10-15.

  sonnet46:
    provider: anthropic
    model: claude-sonnet-4-6
    input_per_m: 3.00
    output_per_m: 15.00
    cache_read_per_m: 0.30
    cache_write_per_m: 3.75
    max_tokens: 2048
    note: verified 2026-10-07 (deprecations page lists the id as active, pricing page has the price).

  opus47:
    provider: anthropic
    model: claude-opus-4-7
    input_per_m: 5.00
    output_per_m: 25.00
    cache_read_per_m: 0.50
    cache_write_per_m: 6.25
    max_tokens: 2048
    note: verified 2026-10-07 (deprecations page lists the id as active, pricing page has the price).

  # ---- OpenAI --------------------------------------------------------------------------

  gpt6_luna:
    provider: openai_compatible
    model: gpt-6-luna
    api_key_env: OPENAI_API_KEY
    input_per_m: 0.10
    output_per_m: 0.50
    cache_read_per_m: 0.01
    max_tokens: 2048
    reasoning: {reasoning_effort: low}
    note: verified 2026-10-07 (developers.openai.com models and pricing pages, standard tier, short context). The cheap OpenAI model.

  gpt61_sol:
    provider: openai_compatible
    model: gpt-6.1-sol
    api_key_env: OPENAI_API_KEY
    input_per_m: 2.00
    output_per_m: 10.00
    cache_read_per_m: 0.10
    max_tokens: 2048
    reasoning: {reasoning_effort: low}
    note: verified 2026-10-07 (developers.openai.com models and pricing pages, standard tier, short context).

  gpt6_astra:
    provider: openai_compatible
    model: gpt-6-astra
    api_key_env: OPENAI_API_KEY
    input_per_m: 10.00
    output_per_m: 50.00
    cache_read_per_m: 1.00
    max_tokens: 2048
    reasoning: {reasoning_effort: low}
    note: verified 2026-10-07 (developers.openai.com models and pricing pages, standard tier, short context). Expensive.

  gpt54_mini:
    provider: openai_compatible
    model: gpt-5.4-mini
    api_key_env: OPENAI_API_KEY
    input_per_m: 0.75
    output_per_m: 4.50
    cache_read_per_m: 0.075
    max_tokens: 2048
    reasoning: {reasoning_effort: low}
    note: unverified. Not on the OpenAI models or pricing pages on 2026-10-07 (may be retired). Id from the openai SDK literal list, price from a third party page (Aug 2026).

  # ---- Other endpoints -----------------------------------------------------------------

  openrouter_example:
    provider: openai_compatible
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    model: anthropic/claude-sonnet-4.6
    input_per_m: 3.00
    output_per_m: 15.00
    max_tokens: 2048
    note: unverified. Guessed OpenRouter id and price, check openrouter.ai/models before use.

  ollama_example:
    provider: openai_compatible
    base_url: http://localhost:11434/v1
    api_key_env: OLLAMA_API_KEY         # any value works for a local server, may stay unset
    model: llama3.1:8b
    input_per_m: 0.0
    output_per_m: 0.0
    max_tokens: 2048
    note: local model, free, unverified id. Use whatever `ollama list` shows as the id.
