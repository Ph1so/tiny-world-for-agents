[project]
name = "tinyworld"
version = "0.1.0"
description = "A small voxel sandbox with no goal, and an LLM agent that lives in it."
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pydantic>=2",
    "pyyaml",
    "pytest",
    "fastapi",
    "uvicorn",
    "pandas",
    "plotly",
    "anthropic",
    "openai",
    "httpx",
    "python-dotenv",
    "websockets>=17.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tinyworld"]

[tool.pytest.ini_options]
testpaths = ["tests"]
